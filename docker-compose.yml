services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-webhook_db}
      POSTGRES_USER: ${DB_USER:-webhook_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webhook_pass}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webhook_user} -d ${DB_NAME:-webhook_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - webhook-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8090}:8090"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-webhook_db}
      DB_USER: ${DB_USER:-webhook_user}
      DB_PASSWORD: ${DB_PASSWORD:-webhook_pass}
      ALLOW_INTERNAL_ENDPOINTS: ${ALLOW_INTERNAL_ENDPOINTS:-true}
    networks:
      - webhook-network

volumes:
  postgres_data:

networks:
  webhook-network:
    driver: bridge
