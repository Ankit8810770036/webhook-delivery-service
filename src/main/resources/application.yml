server:
  port: ${PORT:8090}

spring:
  application:
    name: webhook-delivery-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:webhook_db}
    username: ${DB_USER:webhook_user}
    password: ${DB_PASSWORD:webhook_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

webhook:
  delivery:
    max-attempts: 8
    initial-backoff-seconds: 5
    backoff-multiplier: 2.0
    max-backoff-seconds: 86400
    jitter-factor: 0.2
    lease-duration-seconds: 60
    batch-size: 20
    poll-interval-ms: 1000
    worker-pool-size: 10
  http-client:
    connect-timeout-ms: 4000
    read-timeout-ms: 6000
  circuit-breaker:
    failure-threshold: 5
    cooldown-seconds: 60
  security:
    allow-internal: ${ALLOW_INTERNAL_ENDPOINTS:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-} tenantId=%X{tenantId:-}] - %msg%n"
  level:
    com.webhook.delivery: INFO
    org.springframework.web: INFO
